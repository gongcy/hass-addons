name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pytest
        run: pip install pytest

      # git, rsync and ssh-keygen are preinstalled on ubuntu-latest;
      # the add-on itself needs no third-party runtime dependencies.
      - name: Run tests
        run: python -m pytest -v
